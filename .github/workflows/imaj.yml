# Koda her push'ta FaceSwap imajını derler ve ghcr.io/<kullanıcı>/faceswap-hazir:latest olarak yayınlar.
name: imaj
on:
  push:
    branches: [main]
    paths: ['sunucu/**', 'runpod/**', 'docker/**', '.github/workflows/imaj.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - name: Disk aç
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: VERSION=${{ github.run_number }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/faceswap-hazir:latest
            ghcr.io/${{ github.repository_owner }}/faceswap-hazir:${{ github.run_number }}
