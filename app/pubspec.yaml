name: faceswap
description: "FaceSwap - videodaki bir kişinin yüzünü seçtiğin yüzle değiştirir (kendi sunucun)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  image_picker: ^1.1.2
  video_player: ^2.9.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  share_plus: ^10.1.4
  gal: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/runpod/bootstrap.sh
    - assets/runpod/code.tar.gz
